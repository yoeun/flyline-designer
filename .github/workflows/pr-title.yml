# PRs are squash merged with the PR title as the commit subject on main,
# so the title has to follow Conventional Commits.
# Only the title is read, so new commits don't need a re-check (no synchronize), and drafts
# are skipped; marking a PR ready for review runs the check.
name: PR title

on:
  pull_request_target:
    types: [opened, edited, reopened, ready_for_review]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^[a-z].+[^.]$
          subjectPatternError: |
            The subject "{subject}" should start with a lower-case letter and not end with a period.
