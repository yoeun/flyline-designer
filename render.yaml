# Render Blueprint: the app as a Static Site and the shares API as a Node web service, whose database is
# its own role and database on the shared Render Postgres instance `shared-db` (like Tally and Jardinier), deployed from the release branch, which a scheduled workflow
# (.github/workflows/release.yml) fast-forwards to main twice a day. See the Deploy section of the README for connecting it.
services:
  - type: web
    runtime: static
    name: flyline-designer
    branch: release
    autoDeployTrigger: commit
    # Skip rebuilds for changes that can't affect the site.
    buildFilter:
      ignoredPaths:
        - "**/*.md"
        - docs/**
        - server/**
        - .github/**
    # Tests run first so a failing build is never published.
    buildCommand: npm ci && npm test && npm run build
    staticPublishPath: ./dist
    envVars:
      # Vite 8 needs Node 20.19+ or 22.12+; match local dev.
      - key: NODE_VERSION
        value: "24"
      # The shares API below. Render shows its real address on the service page; if it isn't this one, change it here.
      - key: VITE_API_URL
        value: https://flyline-designer-api.onrender.com
    routes:
      # Any path without a file serves the app, so view links (/r/<id>) and later path routes load it.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Vite puts a content hash in every asset name, so they never change once published.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # The page itself is always revalidated, so a deploy takes effect on the next load.
      - path: /
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /r/*
        name: Cache-Control
        value: no-cache

  - type: web
    runtime: node
    name: flyline-designer-api
    # Free sleeps when idle, so the first call after a quiet spell waits for it to start.
    plan: free
    branch: release
    autoDeployTrigger: commit
    rootDir: server
    # Only the API's own files matter (paths are from the repo root).
    buildFilter:
      paths:
        - server/**
        - render.yaml
      ignoredPaths:
        - server/**/*.md
        - server/**/*.test.js
    # The same region as shared-db: its internal URL only works within one.
    region: oregon
    buildCommand: npm ci
    # shared-postgres.mjs creates the app's role and database (app_flyline_designer) on shared-db if missing,
    # then prints its DATABASE_URL. It runs at start, not as a pre-deploy step, because those need a paid plan.
    startCommand: node shared-postgres.mjs && DATABASE_URL="$(node shared-postgres.mjs --url)" node index.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      # The app's name on shared-db: its role and database are app_flyline_designer.
      - key: APP_DB_NAME
        value: flyline_designer
      # POSTGRES_ADMIN_URL for the shared Render Postgres (instance `shared-db`).
      - fromGroup: shared-db
      # The site origins that may call the API. Add the custom domain here when there is one.
      - key: ALLOWED_ORIGINS
        value: https://flyline-designer.onrender.com

